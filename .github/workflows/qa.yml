# Starts the real FraudWatch API in Docker, then runs the whole QA suite against it.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # nightly regression run

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the QA suite
        uses: actions/checkout@v4

      - name: Checkout the API under test
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fraudwatch-api
          path: fraudwatch-api

      - name: Start the API (PostgreSQL + Spring Boot)
        working-directory: fraudwatch-api
        run: docker compose up -d --build

      - name: Wait until the API is healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 5
          done
          docker compose -f fraudwatch-api/docker-compose.yml logs api
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test tools
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: API, security and contract tests
        run: pytest tests/api --html=reports/api-report.html --self-contained-html

      - name: End-to-end UI tests
        run: pytest tests/e2e --html=reports/e2e-report.html --self-contained-html --tracing=retain-on-failure

      - name: Load test (30 s, 20 users)
        run: locust -f load/locustfile.py --host http://localhost:8080 --headless -u 20 -r 5 -t 30s --html reports/load-report.html --exit-code-on-error 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            test-results/
